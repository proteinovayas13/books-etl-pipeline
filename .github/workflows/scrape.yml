name: Daily Book Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Run ETL pipeline
        id: etl
        continue-on-error: true
        run: |
          python src/01_parser.py
          python src/02_create_dwh.py
          python src/03_load_data.py
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: books-data
          path: |
            books_raw.csv
            dwh_books.db
            data/*.csv
      
      - name: Send Telegram notification
        if: always()
        run: |
          if [ "${{ steps.etl.outcome }}" == "success" ]; then
            STATUS="Успешно"
            MESSAGE="Парсинг завершён успешно!"
          else
            STATUS="Ошибка"
            MESSAGE="Произошла ошибка при парсинге!"
          fi
          
          curl -s -X POST https://api.telegram.org/bot8945201284:AAFIr5RguYCZLaX2eLyUJ_F63od_2MuSP28/sendMessage \
            -d chat_id=6159736716 \
            -d text="$EMOJI *ETL Пайплайн: Книги* $EMOJI%0A%0A *Статус:* $STATUS%0A $MESSAGE%0A $(date '+%d.%m.%Y %H:%M:%S')%0A%0A https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d parse_mode="Markdown"
